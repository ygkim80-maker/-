{% extends "base.html" %}
{% block title %}AI 튜터{% endblock %}
{% block content %}
<h1>AI 학습 튜터</h1>
<p class="muted">사내 강의 콘텐츠를 검색해 답변합니다. ANTHROPIC_API_KEY가 설정된 경우 Claude가 근거 기반으로 답변을 생성하고, 없으면 관련 강의 발췌를 바로 보여줍니다.</p>

<div class="card">
  <label for="course-select" class="muted">강의 범위 (선택):</label>
  <select id="course-select">
    <option value="">전체 강의에서 검색</option>
    {% for course in courses %}
    <option value="{{ course.id }}">{{ course.title }}</option>
    {% endfor %}
  </select>

  <div id="chat-log" class="chat-log" style="margin-top:16px;">
    <div class="chat-bubble assistant">안녕하세요! 사내 교육 콘텐츠에 대해 궁금한 점을 물어보세요. 예) "위임을 잘 하려면 어떻게 해야 해?"</div>
  </div>

  <form id="chat-form" class="chat-form">
    <input type="text" id="question-input" placeholder="질문을 입력하세요" autocomplete="off" required>
    <button class="btn" type="submit">보내기</button>
  </form>
</div>

<script>
const log = document.getElementById('chat-log');
const form = document.getElementById('chat-form');
const input = document.getElementById('question-input');
const courseSelect = document.getElementById('course-select');

function addBubble(text, role, citations) {
  const bubble = document.createElement('div');
  bubble.className = 'chat-bubble ' + role;
  bubble.textContent = text;
  if (citations && citations.length) {
    const cite = document.createElement('span');
    cite.className = 'citation';
    cite.textContent = '참고: ' + citations.join(', ');
    bubble.appendChild(cite);
  }
  log.appendChild(bubble);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addBubble(question, 'user');
  input.value = '';

  const thinking = document.createElement('div');
  thinking.className = 'chat-bubble assistant';
  thinking.textContent = '생각 중...';
  log.appendChild(thinking);
  log.scrollTop = log.scrollHeight;

  try {
    const courseId = courseSelect.value ? parseInt(courseSelect.value, 10) : null;
    const res = await fetch('/api/tutor/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, course_id: courseId }),
    });
    const data = await res.json();
    thinking.remove();
    addBubble(data.answer, 'assistant', data.citations);
  } catch (err) {
    thinking.remove();
    addBubble('오류가 발생했습니다. 잠시 후 다시 시도해주세요.', 'assistant');
  }
});
</script>
{% endblock %}
